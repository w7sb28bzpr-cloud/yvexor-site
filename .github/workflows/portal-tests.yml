name: Test YVEXOR portal
on:
  push:
    paths: ['portal/**', '.github/workflows/portal-tests.yml']
  pull_request:
    paths: ['portal/**', '.github/workflows/portal-tests.yml']
permissions:
  contents: read
jobs:
  portal:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: portal_ci
          POSTGRES_USER: portal_ci
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PORTAL_SECRET_KEY: ephemeral-ci-only-not-a-production-secret
      PORTAL_DEBUG: '1'
      PORTAL_DB_NAME: portal_ci
      PORTAL_DB_USER: portal_ci
      PORTAL_DB_PASSWORD: ephemeral-ci-only
      PORTAL_DB_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: portal/requirements.lock
      - run: pip install -r portal/requirements.lock
      - run: python portal/manage.py makemigrations --check --dry-run
      - run: python portal/manage.py test core
