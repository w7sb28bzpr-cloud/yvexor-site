{% if rows.has_other_pages %}<nav class="shop-nav" aria-label="Pagination">{% if rows.has_previous %}<a href="?page={{ rows.previous_page_number }}&q={{ request.GET.q|urlencode }}&category={{ request.GET.category|urlencode }}&type={{ request.GET.type|urlencode }}&status={{ request.GET.status|urlencode }}">Précédent</a>{% endif %}<span>{{ rows.number }} / {{ rows.paginator.num_pages }}</span>{% if rows.has_next %}<a href="?page={{ rows.next_page_number }}&q={{ request.GET.q|urlencode }}&category={{ request.GET.category|urlencode }}&type={{ request.GET.type|urlencode }}&status={{ request.GET.status|urlencode }}">Suivant</a>{% endif %}</nav>{% endif %}
