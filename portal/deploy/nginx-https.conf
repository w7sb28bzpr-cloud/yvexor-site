# Enable only after the certificate for both names exists.
server {
    listen 80;
    listen [::]:80;
    server_name client.yvexor.com admin.yvexor.com;
    location /.well-known/acme-challenge/ { root /var/www/yvexor-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name client.yvexor.com admin.yvexor.com;
    ssl_certificate /etc/letsencrypt/live/client.yvexor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/client.yvexor.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 128k;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 35s;
    }
}
